{% extends "base.html" %}
{% block title %}Sign in · Tally{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <form method="post">
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" required></label>
    <label class="inline"><input type="checkbox" name="remember"> Keep me signed in</label>
    <button type="submit">Sign in</button>
  </form>
  <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-login_uri="{{ url_for('auth.login', _external=True) }}"></div>
  <p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
