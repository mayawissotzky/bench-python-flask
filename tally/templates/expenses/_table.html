<table class="grid">
  <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th>Status</th></tr></thead>
  <tbody>
  {% for row in rows %}
    <tr>
      <td>{{ row.spent_on }}</td>
      <td><a href="{{ url_for('expenses.detail', expense_id=row.id) }}">{{ row.description }}</a></td>
      <td>{{ row.category }}</td>
      <td class="num">{{ row.amount|money(row.currency) }}</td>
      <td><span class="pill pill-{{ row.status }}">{{ row.status }}</span></td>
    </tr>
  {% else %}
    <tr><td colspan="5" class="muted">No expenses found.</td></tr>
  {% endfor %}
  </tbody>
</table>
